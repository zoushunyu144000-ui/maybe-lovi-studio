name: MAYBE LOVI Web Build

on:
  push:
    branches:
      - agent/dev-public-core-20260913
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
